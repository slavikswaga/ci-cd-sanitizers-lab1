name: 'C++ CI'

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure CMake
        run: cmake --preset clang-sanitizers

      - name: Build
        run: cmake --build --preset clang-sanitizers
        
      - name: Run
        run: ./build/clang-sanitizers/ci-cd-sanitizers-lab1
  build-windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure CMake
        run: cmake --preset clang-sanitizers

      - name: Build
        run: cmake --build --preset clang-sanitizers
        
      - name: Run
        run: ./build/clang-sanitizers/ci-cd-sanitizers-lab1
      
