name: 'C++ CI'

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: install-cmake
        uses: Symbitic/install-cmake@v0.1.0
        with:
          # Version of CMake to install
          cmake: 4.2.1
          # Version of ninja-build to install
          ninja: 1.13.2
      - name: Install Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 21.1.7
          
      - name: Configure CMake
        run: cmake --preset clang-sanitizers

      - name: Build
        run: cmake --build --preset clang-sanitizers
