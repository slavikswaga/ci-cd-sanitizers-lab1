name: 'C++ CI'

on:
  push:
    branches:
      - main
      - test-branch

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure CMake
        run: cmake --preset clang-sanitizers

      - name: Build
        run: cmake --build --preset clang-sanitizers

      - name: Run
        run: ./build/clang-sanitizers/ci-cd-sanitizers-lab1

      - name: Build .deb package
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cmake --build --preset clang-sanitizers --target package
          ls -la build/clang-sanitizers/*.deb

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/clang-sanitizers/ci-cd-sanitizers-lab1-0.1.0.${{ github.run_number }}-Linux.deb
          asset_name: ci-cd-sanitizers-lab1-0.1.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build-macos:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure CMake
        run: cmake --preset clang-sanitizers

      - name: Build
        run: cmake --build --preset clang-sanitizers

      - name: Run
        run: ./build/clang-sanitizers/ci-cd-sanitizers-lab1
